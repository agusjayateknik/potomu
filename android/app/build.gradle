plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sighdev.fotomu.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sighdev.fotomu.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Capacitor web asset configuration
        sourceSets {
            main {
                assets.srcDirs = ['src/main/assets', '../../']
            }
        }
    }

    signingConfigs {
        release {
            storeFile file('../../keystore/fotomu.keystore')
            storePassword 'Fotomu2024!'
            keyAlias 'fotomu_key'
            keyPassword 'Fotomu2024!'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation project(':capacitor-android')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Capacitor plugins
    implementation 'com.capacitorjs:camera:5.0.1'
    implementation 'com.capacitorjs:filesystem:5.0.1'
    implementation 'com.capacitorjs:splashscreen:5.0.1'
}